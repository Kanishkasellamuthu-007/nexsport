<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signing you in… — NexSport</title>
  <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>

<body>
  <div class="container">
    <div class="card auth-card">
      <div class="card-body text-center">
        <div class="spinner-border text-success mb-3" role="status">
          <span class="visually-hidden">Loading…</span>
        </div>
        <p id="callback-status">Completing sign-in…</p>
        <a href="index.html" class="d-none" id="back-to-login">Back to sign in</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    /*
     * OAuth callback handler.
     * Google redirects back here with #access_token=...&refresh_token=...
     * We let supabase-js consume the hash, then continue to the dashboard.
     */
    (async function () {
      const status = document.getElementById("callback-status");
      const back = document.getElementById("back-to-login");
      try {
        const { data, error } = await supabaseClient.auth.getSession();
        // detectSessionInUrl is disabled, so parse the hash manually once:
        if (location.hash.includes("access_token")) {
          const params = new URLSearchParams(location.hash.substring(1));
          if (params.get("access_token")) {
            await supabaseClient.auth.setSession({
              access_token: params.get("access_token"),
              refresh_token: params.get("refresh_token"),
            });
            history.replaceState(null, "", location.pathname); // scrub token from URL
          }
        }

        const session = (await supabaseClient.auth.getSession()).data.session;
        if (!session) throw new Error("No session returned");

        // Ensure a profile row exists (first Google sign-in).
        const res = await fetch(CONFIG.API_BASE_URL + "/api/auth/profile", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + session.access_token,
          },
          body: JSON.stringify({
            full_name: session.user.user_metadata.full_name || "",
          }),
        });

        const redirect = getSafeAuthRedirect(
          new URLSearchParams(location.search).get("redirect")
        );
        status.textContent = "Signed in! Redirecting…";
        setTimeout(
          () => window.location.replace(redirect || "dashboard.html"),
          600
        );
      } catch (err) {
        status.textContent = "Sign-in failed: " + (err.message || "unknown error");
        back.classList.remove("d-none");
      }
    })();
  </script>
</body>

</html>
